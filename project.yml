name: TennesseeEats
options:
  bundleIdPrefix: com.tennesseeeats
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  TennesseeEats:
    type: application
    platform: iOS
    sources:
      - path: TennesseeEats
    info:
      path: TennesseeEats/Info.plist
      properties:
        CFBundleDisplayName: TN Eats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Light      # the palette is light-only (Design/Theme.swift); dark mode made lists unreadable
        NSLocationWhenInUseUsageDescription: "Your location sorts hot chicken shacks, barbecue joints and restaurants by distance and shows where you are on the map. It stays on your device."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [maps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennesseeeats.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [TennesseeEatsTests, TennesseeEatsUITests]

  TennesseeEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TennesseeEatsTests
    dependencies:
      - target: TennesseeEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennesseeeats.ios.tests
        GENERATE_INFOPLIST_FILE: true

  TennesseeEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TennesseeEatsUITests
    dependencies:
      - target: TennesseeEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennesseeeats.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TennesseeEats
